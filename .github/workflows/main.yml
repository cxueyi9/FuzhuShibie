name: Build FloatInject Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -arch arm64 \
            -o FloatInject.dylib \
            FloatInject.m \
            UITouch-KIFAdditions.m \
            UIEvent+KIFAdditions.m \
            UIApplication-KIFAdditions.m \
            IOHIDEvent+KIF.m \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework IOKit \
            -framework AudioToolbox \
            -framework QuartzCore \
            -fobjc-arc \
            -miphoneos-version-min=12.0

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FloatInject.dylib
          path: FloatInject.dylib
